<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14181f">
<title>Kitchen Assistant</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <nav class="tabs">
    <button class="tab active" data-screen="cook">Cook</button>
    <button class="tab" data-screen="recipes">Recipes</button>
    <button class="tab" data-screen="pantry">Pantry</button>
  </nav>
  <div class="clock">
    <span id="now">--:--</span>
    <span id="plating" class="muted">plating not set</span>
  </div>
  <div class="conn"><span id="conn-dot" class="dot"></span><span id="conn-text">connecting</span></div>
  <button id="server-chip" class="server-chip" title="Server">
    <span class="gear">&#9881;</span><span id="server-badge" class="server-badge" hidden></span>
  </button>
</header>

<div id="server-panel" class="server-panel" hidden>
  <div class="server-row"><span>Uptime</span><b id="srv-uptime">-</b></div>
  <div class="server-row"><span>Model</span><b id="srv-model">-</b></div>
  <div class="server-row"><span>Backend</span><b id="srv-backend">-</b></div>
  <div id="srv-changed" class="server-changed" hidden></div>
  <div id="srv-warn" class="server-warn" hidden></div>
  <div class="server-actions">
    <button id="srv-restart" class="small">Restart server</button>
    <button id="srv-close" class="small ghost">Close</button>
  </div>
</div>

<div id="mic-banner" class="mic-banner" hidden></div>

<main id="screen-cook" class="screen active">
  <section class="col col-recipes">
    <div class="col-head">
      <h2>Plan <span id="plan-summary" class="muted"></span></h2>
      <button id="btn-add-recipe" class="small">Recipes</button>
    </div>
    <div id="appliances" class="appliances"></div>
    <div id="plan-now" class="plan-now"></div>
    <div id="plan-next" class="plan-next"></div>
    <details id="plan-all" class="plan-all">
      <summary>Full plan <span id="plan-count" class="muted"></span></summary>
      <div id="plan-list" class="plan-list"></div>
    </details>
    <details id="recipes-all" class="recipes-all">
      <summary>Recipes <span id="recipes-count" class="muted"></span></summary>
      <div id="recipe-cards" class="cards"></div>
    </details>
  </section>

  <section class="col col-center">
    <div class="assistant">
      <div id="avatar" class="avatar" data-state="idle">
        <svg class="chef" viewBox="0 0 100 104" aria-hidden="true">
          <circle class="halo" cx="50" cy="56" r="46"/>
          <circle class="halo-spin" cx="50" cy="56" r="46"/>
          <g class="steam">
            <path d="M36 12c4-4 0-7 0-10"/><path d="M50 8c4-5 0-8 0-11"/><path d="M64 12c4-4 0-7 0-10"/>
          </g>
          <g class="toque">
            <circle cx="32" cy="32" r="12"/><circle cx="50" cy="25" r="14"/><circle cx="68" cy="32" r="12"/>
            <path class="band" d="M31 39h38v8a5 5 0 0 1-5 5H36a5 5 0 0 1-5-5z"/>
          </g>
          <circle class="head" cx="50" cy="66" r="23"/>
          <g class="brows"><path d="M38 57c3-2 7-2 10 0"/><path d="M52 57c3-2 7-2 10 0"/></g>
          <g class="eyes"><ellipse class="eye" cx="43" cy="64" rx="3.4" ry="4.2"/>
            <ellipse class="eye" cx="57" cy="64" rx="3.4" ry="4.2"/></g>
          <path class="mouth-smile" d="M42 75c4 5 12 5 16 0"/>
          <ellipse class="mouth-open" cx="50" cy="76" rx="7" ry="5"/>
        </svg>
      </div>
      <div class="assistant-text">
        <div id="status" class="status">Connecting</div>
        <div id="next-action" class="next-action"></div>
      </div>
    </div>
    <div id="conversation" class="conversation"></div>
    <div class="controls">
      <button id="listen-toggle" class="listen" disabled>Always listening: off</button>
      <button id="ptt" class="ptt" disabled>Hold to talk</button>
      <form id="text-form" class="text-form">
        <input id="text-input" placeholder="or type here" autocomplete="off">
        <button class="small">Send</button>
      </form>
    </div>
  </section>

  <section class="col col-right">
    <h2>Timers</h2>
    <div id="timers" class="timers"></div>
    <h2>Timeline</h2>
    <div id="timeline" class="timeline"></div>
    <div id="conflicts" class="conflicts"></div>
    <label class="proactivity">Proactivity
      <input id="proactivity" type="range" min="0" max="1" step="0.1" value="0.5">
    </label>
  </section>
</main>

<main id="screen-recipes" class="screen">
  <section class="recipes-screen">
    <div class="col-head">
      <h2>Choose what to cook</h2>
      <div class="plating-pick">
        <label class="muted">Diet
          <select id="diet-select">
            <option value="none">no restriction</option>
            <option value="halal">halal</option>
            <option value="vegetarian">vegetarian</option>
            <option value="vegan">vegan</option>
          </select>
        </label>
        <label class="muted"><input id="plating-on" type="checkbox"> serving at a set time</label>
        <input id="plating-time" type="time" disabled>
        <button id="btn-start-cooking">Start cooking</button>
      </div>
    </div>
    <form id="suggest-form" class="suggest-form">
      <label>Not sure what to cook? Suggest meals for
        <input id="suggest-meals" type="number" min="1" max="30" step="1" value="8"> portions</label>
      <button class="small">Ask</button>
      <span id="suggest-hint" class="muted">uses what's in your pantry</span>
    </form>
    <div id="suggest-out" class="suggest-out" hidden></div>
    <div id="recipe-choices" class="choices"></div>
    <form id="import-form" class="import-form">
      <input id="import-url" type="url" placeholder="Paste a recipe URL to add it to the library">
      <button class="small">Import</button>
    </form>
  </section>
</main>

<main id="screen-pantry" class="screen">
  <section class="pantry">
    <div class="col-head">
      <h2>Pantry</h2>
      <form id="pantry-add" class="pantry-add">
        <input name="name" placeholder="item" required>
        <input name="amount" type="number" step="any" min="0" placeholder="amount" required>
        <input name="unit" placeholder="unit (g, ml, cup, blank)">
        <button class="small">Add</button>
      </form>
    </div>
    <table id="pantry-table" class="pantry-table">
      <thead><tr><th>Item</th><th>Amount</th><th>Unit</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
